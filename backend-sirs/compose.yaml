services:
  banco-dados:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sirs
      POSTGRES_USER: ${DB_USERNAME:-sirs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sirs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://banco-dados:5432/sirs
      DB_USERNAME: ${DB_USERNAME:-sirs}
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Preencha JWT_SECRET com pelo menos 32 bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    depends_on:
      banco-dados:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  dados-postgresql:
