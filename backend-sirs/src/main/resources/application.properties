spring.application.name=sirs-api
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100
spring.jackson.deserialization.fail-on-unknown-properties=true
sirs.jwt.secret=${JWT_SECRET}
sirs.jwt.issuer=sirs-api
sirs.jwt.ttl=PT30M
sirs.cors.origins=${CORS_ORIGINS:http://localhost:5173}
sirs.bootstrap.email=${ADMIN_EMAIL:}
sirs.bootstrap.password=${ADMIN_PASSWORD:}
sirs.privacy.cron=${PRIVACY_CRON:0 0 3 * * *}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
logging.pattern.level=%5p [requestId:%X{requestId}]

# Dotenv local tem prioridade inferior ao ambiente e aos argumentos de execucao.
sirs.environment-file.enabled=${ENV_FILE_ENABLED:true}
sirs.auth.provider=local
sirs.supabase.url=${SUPABASE_URL:}
sirs.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
sirs.supabase.secret-key=${SUPABASE_SECRET_KEY:}
sirs.supabase.jwks-url=${SUPABASE_JWKS_URL:${SUPABASE_URL:}/auth/v1/.well-known/jwks.json}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=sirs
spring.flyway.default-schema=sirs

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=sirs