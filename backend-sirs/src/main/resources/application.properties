spring.application.name=sirs-api

# Banco de dados (RES-05 - PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sirs}
spring.datasource.username=${DB_USERNAME:sirs}
spring.datasource.password=${DB_PASSWORD:sirs}

# O esquema e controlado pelo Flyway (RNF-MAN-02), nao pelo Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
