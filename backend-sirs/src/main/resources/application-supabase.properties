# Ative explicitamente o perfil supabase. Use os dados de Connect > Session pooler.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.currentSchema=sirs
spring.jpa.properties.hibernate.default_schema=sirs
spring.flyway.schemas=sirs
spring.flyway.default-schema=sirs
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration,classpath:db/supabase
sirs.auth.provider=supabase
