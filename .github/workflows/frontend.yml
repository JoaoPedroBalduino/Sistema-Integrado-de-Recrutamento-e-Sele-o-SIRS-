name: Frontend SIRS
on:
  push:
    paths: ['frontend-sirs/**', '.github/workflows/frontend.yml', 'backend-sirs/src/main/java/br/com/sirs/api/model/**']
  pull_request:
    paths: ['frontend-sirs/**', '.github/workflows/frontend.yml', 'backend-sirs/src/main/java/br/com/sirs/api/model/**']
permissions:
  contents: read
jobs:
  verificar:
    name: Verificar frontend e navegadores
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-sirs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-sirs/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-frontend
          path: |
            frontend-sirs/playwright-report/
            frontend-sirs/test-results/
