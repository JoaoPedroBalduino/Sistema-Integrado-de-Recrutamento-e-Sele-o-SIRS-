spring.application.name=sirs-api
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sirs}
spring.datasource.username=${DB_USERNAME:sirs}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100
spring.jackson.deserialization.fail-on-unknown-properties=true
sirs.jwt.secret=${JWT_SECRET}
sirs.jwt.issuer=sirs-api
sirs.jwt.ttl=PT30M
sirs.cors.origins=${CORS_ORIGINS:http://localhost:5173}
sirs.bootstrap.email=${ADMIN_EMAIL:}
sirs.bootstrap.password=${ADMIN_PASSWORD:}
sirs.privacy.cron=${PRIVACY_CRON:0 0 3 * * *}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
logging.pattern.level=%5p [requestId:%X{requestId}]
